[build-system]
requires = ["flit_core >=4.0.2,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "pymillis"
authors = [{name = "wudi", email = "wuchendi96@gmail.com"}]
description = "Use this package to easily convert various time formats to milliseconds."
readme = "README.md"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["time", "milliseconds", "ms", "duration", "conversion"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
"Bug Reports" = "https://github.com/WuChenDi/pymillis/issues"
"Source" = "https://github.com/WuChenDi/pymillis"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests", "pymillis"]
addopts = ["--strict-markers", "--strict-config", "--doctest-modules"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pymillis"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "@overload", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["pymillis"]
strict = true
warn_unreachable = true
